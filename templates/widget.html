<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ER 일정 위젯</title><link rel="stylesheet" href="/static/widget.css?v=matrix-1"></head><body>
<div class="widget"><header><strong>ER 일정</strong><div class="weeknav"><button id="prev">‹ 1주 이전</button><button id="current">오늘</button><button id="next">1주 다음 ›</button><span id="range"></span></div><div class="header-actions"><button id="add" class="primary">＋ 일정 등록</button><a href="/" target="_blank" rel="noopener" title="전체 화면 열기" aria-label="전체 화면 열기">↗</a><button id="refresh" title="새로고침" aria-label="새로고침">↻</button><button id="closeWidget" type="button" title="위젯 닫기">✕ 닫기</button></div></header>
<p id="message" role="status" hidden></p><main id="list" class="matrix-scroll" tabindex="0" aria-label="14일 일정표"></main></div>
<dialog id="editor"><div class="dialog-head"><strong id="editorSummary">일정 등록</strong><button id="closeEditor" type="button" aria-label="닫기">✕</button></div><form id="eventForm"><div class="form-grid"><label>구분<select name="row" required></select></label><label>주체 태그<input name="actor" maxlength="60" placeholder="예: 지회, 당진"></label><label>시작일<input name="start" type="date" required></label><label>종료일<input name="end" type="date" required></label><label class="full">일정 제목<input name="title" maxlength="180" required></label></div><p id="formError" role="alert"></p><div class="form-actions"><button id="cancelEdit" type="button">취소</button><button id="save" type="submit" class="primary">등록</button></div></form></dialog>
<dialog id="detail"><div class="dialog-head"><strong>일정 상세</strong><button id="closeDetail" type="button" aria-label="닫기">✕</button></div><div id="detailBody"></div><div class="form-actions"><button id="editEvent" type="button">수정</button><button id="deleteEvent" type="button">삭제</button></div><p id="detailError" role="alert"></p></dialog>
<script src="/static/widget.js?v=frameless-1"></script></body></html>
