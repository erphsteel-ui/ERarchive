<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ER 일정 위젯</title><link rel="stylesheet" href="/static/widget.css?v=1"></head><body>
<div class="widget"><header><div><strong>ER 일정</strong><span id="today"></span></div><div class="header-actions"><button id="refresh" title="새로고침" aria-label="새로고침">↻</button><a href="/" target="_blank" rel="noopener" title="전체 화면 열기" aria-label="전체 화면 열기">↗</a></div></header>
<nav id="filters" aria-label="일정 구분"><button data-filter="all" aria-pressed="true">전체</button><button data-filter="pohang" aria-pressed="false">포항</button><button data-filter="otherbranch" aria-pressed="false">타지회</button><button data-filter="labor" aria-pressed="false">금속노조</button></nav>
<details id="editor"><summary id="editorSummary">＋ 일정 등록</summary><form id="eventForm"><div class="form-grid"><label>구분<select name="row" required></select></label><label>주체 태그<input name="actor" maxlength="60" placeholder="예: 지회, 당진"></label><label>시작일<input name="start" type="date" required></label><label>종료일<input name="end" type="date" required></label><label class="full">일정 제목<input name="title" maxlength="180" required></label></div><p id="formError" role="alert"></p><div class="form-actions"><button id="cancelEdit" type="button" hidden>수정 취소</button><button id="save" type="submit">등록</button></div></form></details>
<div class="weeknav"><button id="prev" aria-label="이전 7일">‹</button><strong id="range"></strong><button id="next" aria-label="다음 7일">›</button><button id="current">오늘</button></div><p id="message" role="status"></p><main id="list" tabindex="0" aria-label="일정 목록"></main></div>
<script src="/static/widget.js?v=1"></script></body></html>
